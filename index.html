    <script>
      // Barvu pozadí (motiv oblohy) známe z minula – nastavíme ji na <html>
      // hned, ať preload i načtená appka mají stejnou barvu bez skoku. Když
      // motiv neznáme, odhadneme noc podle lokálního času.
      (function () {
        try {
          var sky = localStorage.getItem("sky");
          if (!sky) {
            var h = new Date().getHours();
            if (h < 6 || h >= 21) sky = "night";
          }
          if (sky) document.documentElement.dataset.sky = sky;
        } catch (e) {}
        // Světlý/tmavý motiv nastavíme hned – dle uloženého nastavení, jinak
        // podle systému. Zabrání to bliknutí (flash) při startu.
        try {
          var raw = localStorage.getItem("zmoknu.theme");
          var mode = raw ? JSON.parse(raw) : "dark";
          var dark;
          if (mode === "light") dark = false;
          else if (mode === "dark") dark = true;
          else
            dark =
              !window.matchMedia ||
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* Stejné pozadí (gradient) hned od prvního vykreslení jako u načtené
         appky – žádná změna barvy před skeletonem. Motiv (data-sky) na <html>
         se aplikuje přes :root[data-sky] body, shodně s index.css. */
      :root {
        color-scheme: dark;
      }
      html {
        background: linear-gradient(160deg, #05080f, #0a1120) fixed;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: transparent;
      }
      :root[data-sky="clear"] {
        background: linear-gradient(160deg, #0d2a4d, #102f54 60%, #143f66) fixed;
      }
      :root[data-sky="cloud"] {
        background: linear-gradient(160deg, #141b29, #1f2838) fixed;
      }
      :root[data-sky="rain"] {
        background: linear-gradient(160deg, #0d141d, #18222e) fixed;
      }
      :root[data-sky="snow"] {
        background: linear-gradient(160deg, #182032, #28324d) fixed;
      }
      :root[data-sky="night"] {
        background: linear-gradient(160deg, #03060d, #080e1a) fixed;
      }
      /* Světlý motiv – pozadí a barvy skeletonu. */
      :root[data-theme="light"] {
        color-scheme: light;
        background: linear-gradient(160deg, #eaf1fb, #d6e2f3) fixed;
      }
      :root[data-theme="light"][data-sky="clear"] {

      }
      :root[data-theme="light"][data-sky="cloud"] {
        background: linear-gradient(160deg, #dde5f1, #eef1f7) fixed;
      }
      :root[data-theme="light"][data-sky="rain"] {
        background: linear-gradient(160deg, #d5dfea, #e5ebf3) fixed;
      }
      :root[data-theme="light"][data-sky="snow"] {
        background: linear-gradient(160deg, #e8eef7, #f5f8fc) fixed;
      }
      :root[data-theme="light"][data-sky="night"] {
        background: linear-gradient(160deg, #cdd7ea, #dce4f2) fixed;
      }
      :root[data-theme="light"] #boot .b-top::before {

      }
      :root[data-theme="light"] #boot .b-card {
        background: rgba(28, 40, 66, 0.05);
        border-color: rgba(28, 40, 66, 0.1);
      }
      :root[data-theme="light"] #boot .s {

      }
      :root[data-theme="light"] #boot .b-text {

      }
      :root[data-theme="light"] #boot .b-locate {

        border-color: rgba(28, 40, 66, 0.1);
      }
      :root[data-theme="light"] #boot .b-hero-rest {

      }
      :root[data-theme="light"] #boot .yrhead {

      }
      :root[data-theme="light"] #boot .yrrow {
        border-color: rgba(28, 40, 66, 0.06);
      }
      /* Okamžitý skeleton ještě před spuštěním JS. Plně samostatné styly
         (v devu se index.css injektuje až přes JS). Classy jsou prefixované
         b-*, ať je globální index.css po načtení bundle nerozpadne. React
         #boot nemaže – drží ho, dokud nedorazí data. */
      #boot,
      #boot * {
        box-sizing: border-box;
      }
      #boot[hidden] {
        display: none !important;
      }
      #boot {
        --px: clamp(12px, 3vw, 28px);
        position: relative;
        max-width: 1460px;
        margin: 0 auto;
        padding: 0 var(--px) calc(24px + 60px + env(safe-area-inset-bottom, 0px));
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: -0.003em;
        -webkit-font-smoothing: antialiased;
      }
      /* Déšť přes celý skeleton (stejný efekt jako .skel-rain v Reactu), aby
         pršelo hned při prvotním vykreslení, ještě než naběhne JS/React. Kapky
         doplní drobný inline skript níže. */
      #boot .b-rain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }
      #boot .b-raindrop {
        position: absolute;
        top: -32px;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(
          to bottom,
          rgba(130, 175, 255, 0),
          rgba(130, 175, 255, 0.45)
        );
        animation-name: b-rainfall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform, opacity;
      }
      @keyframes b-rainfall {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        8% {
          opacity: var(--op, 0.6);
        }
        92% {
          opacity: var(--op, 0.6);
        }
        100% {
          transform: translateY(102vh);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .b-rain {
          display: none;
        }
      }
      #boot .b-top {
        position: relative;
        /* Vlastní stacking context, aby se ::before (z-index:-1) vykreslil nad
           pozadím body a byl vidět. Zároveň nad deštěm (.b-rain z-index:3), ať
           kapky prší jen přes karty, ne přes hlavičku (stejně jako v Reactu). */
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px;
        margin-bottom: 16px;
      }
      /* Stejné frosted pozadí headeru přes celou šířku viewportu jako
         .topbar::before v index.css. */
      #boot .b-top::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(50% - 50vw);
        right: calc(50% - 50vw);
        z-index: -1;
        background: rgba(6, 10, 18, 0.68);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        backdrop-filter: blur(18px) saturate(140%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      #boot .b-row1 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* Výška 2. řádku odpovídá reálné větě „předpověď pro … na …". */
      #boot .b-row2 {
        display: flex;
        align-items: center;
        min-height: 24px;
      }
      #boot .b-text {

        font-weight: 500;

      }
      #boot .b-brand {

      #boot .b-hero {

        }
      }

    <script>
      // Déšť pro prvotní (boot) skeleton – vygeneruje kapky hned při parsování,
      // ještě než naběhne React. Částečně náhodné, stejně jako v Skeleton.tsx.
      (function () {
        var el = document.getElementById("b-rain");
        if (!el) return;
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        } catch (e) {}
        var n = 26,
          html = "";
        for (var i = 0; i < n; i++) {
          var base = (i / n) * 100;
          var left = Math.min(99, Math.max(0, base + (Math.random() - 0.5) * 9));
          var delay = (Math.random() * 2.4).toFixed(2);
          var dur = (0.8 + Math.random() * 1.3).toFixed(2);
          var h = Math.round(10 + Math.random() * 22);
          var op = (0.3 + Math.random() * 0.45).toFixed(2);
          html +=
            '<span class="b-raindrop" style="left:' +
            left.toFixed(2) +
            "%;height:" +
            h +
            "px;animation-delay:" +
            delay +
            "s;animation-duration:" +
            dur +
            "s;--op:" +
            op +
            '"></span>';
        }
        el.innerHTML = html;
      })();
    </script>
